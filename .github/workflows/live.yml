name: Live provider tests

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  live:
    if: github.repository == 'capawesome-team/repo-sdk'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:live
        env:
          LIVE_GITHUB_TOKEN: ${{ secrets.LIVE_GITHUB_TOKEN }}
          LIVE_GITHUB_REPO: ${{ secrets.LIVE_GITHUB_REPO }}
          LIVE_GITLAB_TOKEN: ${{ secrets.LIVE_GITLAB_TOKEN }}
          LIVE_GITLAB_REPO: ${{ secrets.LIVE_GITLAB_REPO }}
          LIVE_BITBUCKET_EMAIL: ${{ secrets.LIVE_BITBUCKET_EMAIL }}
          LIVE_BITBUCKET_API_TOKEN: ${{ secrets.LIVE_BITBUCKET_API_TOKEN }}
          LIVE_BITBUCKET_REPO: ${{ secrets.LIVE_BITBUCKET_REPO }}
          LIVE_AZURE_ORG: ${{ secrets.LIVE_AZURE_ORG }}
          LIVE_AZURE_PAT: ${{ secrets.LIVE_AZURE_PAT }}
          LIVE_AZURE_REPO: ${{ secrets.LIVE_AZURE_REPO }}
          LIVE_GITEA_TOKEN: ${{ secrets.LIVE_GITEA_TOKEN }}
          LIVE_GITEA_REPO: ${{ secrets.LIVE_GITEA_REPO }}
          LIVE_GITEA_BASE_URL: ${{ secrets.LIVE_GITEA_BASE_URL }}
          LIVE_GIT_HTTP_URL: ${{ secrets.LIVE_GIT_HTTP_URL }}
          LIVE_GIT_HTTP_USERNAME: ${{ secrets.LIVE_GIT_HTTP_USERNAME }}
          LIVE_GIT_HTTP_PASSWORD: ${{ secrets.LIVE_GIT_HTTP_PASSWORD }}
